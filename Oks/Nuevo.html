<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
</head>

<body>
  <div id="visuales"></div>
  
  <script>
    let visuales = document.getElementById("visuales")
    
    async function cargarArchivoJSON() {
      let respuesta = await fetch("Oks.json")
      let datos = await respuesta.json()
      
      
      for(i=0; i<datos.length; i++){
        console.log(i)
        visuales.innerHTML+=`
          
            ${datos[i].name}
            ${datos[i].number} 
            ${datos[i].position} 
            ${datos[i].team}
            <img src="${datos[i].image}">
          
        `
      }
    } 
      
      
          
           
    cargarArchivoJSON()
  </script>
  
</body>

</html>
