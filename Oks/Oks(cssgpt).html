<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  
  <style>
    body {
      font-family: Arial;
      background: #eee;
      margin: 20px;
    }
    
    #visuales {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    
    .card {
      width: 200px;
      background: white;
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
      border-radius: 8px;
    }
    
    .card img {
      width: 100%;
      height: 180px;
    }
  </style>
</head>

<body>
  
  <div id="visuales"></div>
  
  <script>
    let visuales = document.getElementById("visuales");
    
    async function cargarArchivoJSON() {
      let respuesta = await fetch("Oks.json");
      let datos = await respuesta.json();
      
      datos.forEach((jugador) => {
        visuales.innerHTML += `
          <div class="card">
            <h3>${jugador.name}</h3>
            <p>${jugador.number}</p>
            <p>${jugador.position}</p>
            <p>${jugador.team}</p>
            <img src="${jugador.image}">
          </div>
        `;
      });
    }
    
    cargarArchivoJSON();
  </script>
  
</body>

</html>
